name: runner probe
on: push
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: which OS and Tk
        run: |
          sw_vers
          uname -m
          /usr/bin/python3 -c "import tkinter; print('Tk', tkinter.TkVersion)" || true
