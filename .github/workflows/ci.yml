name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests tools
      - name: Mypy
        run: mypy src

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 python3-tk xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify the environment is real
        run: |
          python -V
          python -m pip freeze
          python -c "import phantom, sys; print('phantom', phantom.__version__, sys.version)"
        env:
          PYTHONPATH: src
      - name: Tests (headless, without a display)
        run: python -m pytest -ra -m "not gui"
        env:
          MPLBACKEND: Agg
      - name: GUI smoke tests (Xvfb)
        # A stuck Tk main loop must fail the job instead of hanging for hours:
        # pytest-timeout dumps every thread of a test that stops making
        # progress, faulthandler covers stalls outside a test, and the step has
        # a hard limit.  The log is echoed as annotations because Actions log
        # downloads are not always reachable.
        id: gui
        # The module now covers four tabs, the scroll router and the metadata
        # panel's jobs; the run itself is capped at 8 minutes by ``timeout``
        # below, so this only catches a hang outside the test process.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          # A wedged job leaves a non-daemon thread behind and the interpreter
          # waits for it for ever, so a hard wall-clock cap is the only thing that
          # ends the step early.  SIGABRT is deliberate: faulthandler is enabled,
          # so Python dumps every thread at the moment of the hang instead of the
          # step being killed silently twenty minutes later.
          timeout --preserve-status --signal=ABRT --kill-after=20 480 \
            xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -ra -m gui -v \
              --durations=20 --timeout=120 --timeout-method=thread \
              -o faulthandler_timeout=120 2>&1 | tee gui.log
      - name: GUI log
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("gui.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          interesting = [
              line
              for line in lines
              if re.search(r"FAILED|ERROR|Timeout|^E |assert|Error|Traceback", line)
              and "PASSED" not in line
          ]
          # Every failing test by name first: the tail of the log only shows the
          # last few, and a cascade of failures after one wedged job hides the
          # test that actually broke.
          failures = [line for line in lines if line.startswith("FAILED ")]
          for line in failures[:40]:
              print(f"::error::failed: {line[:400]}")
          print(f"::notice::gui.log: {len(lines)} lines, {len(failures)} failing tests")
          for line in interesting[:15]:
              print(f"::error::first: {line[:900]}")
          # The raw tail: with -v it names the test the run stopped in, which is
          # the only way to see a stall when the step is killed from outside.
          # Notices, not errors: GitHub keeps only ten error annotations per step
          # and the tail is the part that explains a timeout.
          for line in lines[-25:]:
              print(f"::notice::tail: {line[:900]}")
          # Thread dumps a wedged GUI job left behind (tests/test_gui.py) and the
          # dump faulthandler writes when the step is aborted.  Only the frames
          # that matter are printed: the thread headers and the application code.
          frames = [
              line
              for line in lines
              if line.startswith(("Thread ", "Current thread", "=== wedged", "Fatal Python error"))
              or line.lstrip().startswith(("File \"", "Garbage-collecting"))
          ]
          print(f"::notice::frames: {len(frames)} lines")
          print(f"::notice::fatal dump: {'yes' if any('Fatal Python error' in line for line in lines) else 'no'}")
          for line in frames[-25:]:
              print(f"::warning::frame: {line.strip()[:400]}")
          for line in interesting[-5:]:
              print(f"::error::{line[:900]}")
          PY
          if [ "${{ steps.gui.outcome }}" != "success" ]; then
            echo "GUI smoke tests failed or timed out"
            exit 1
          fi
      - name: Keep the GUI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-log-${{ matrix.python-version }}
          path: gui.log
          if-no-files-found: ignore
          retention-days: 7

  benchmark:
    name: slow benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Slow tests
        run: python -m pytest -ra -m slow
