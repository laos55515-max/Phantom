name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests tools
      - name: Mypy
        run: mypy src

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 python3-tk xvfb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify the environment is real
        run: |
          python -V
          python -m pip freeze
          python -c "import phantom, sys; print('phantom', phantom.__version__, sys.version)"
        env:
          PYTHONPATH: src
      - name: Tests (headless, without a display)
        run: python -m pytest -ra -m "not gui"
        env:
          MPLBACKEND: Agg
      - name: GUI smoke tests (Xvfb)
        # A stuck Tk main loop must fail the job instead of hanging for hours:
        # pytest-timeout dumps every thread of a test that stops making
        # progress, faulthandler covers stalls outside a test, and the step has
        # a hard limit.  The log is echoed as annotations because Actions log
        # downloads are not always reachable.
        id: gui
        # The module now covers four tabs, the scroll router and the metadata
        # panel's jobs; the run itself is capped at 8 minutes by ``timeout``
        # below, so this only catches a hang outside the test process.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -o pipefail
          # A wedged job leaves a non-daemon thread behind and the interpreter
          # waits for it for ever, so a hard wall-clock cap ends the step instead
          # of the job burning its own limit.  conftest.py prints the stacks of
          # such threads before Python reaches that wait.
          timeout --preserve-status --signal=TERM --kill-after=20 480 \
            xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -ra -m gui -v \
              --durations=20 --timeout=120 --timeout-method=thread \
              -o faulthandler_timeout=120 2>&1 | tee gui.log
      - name: GUI log
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("gui.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          interesting = [
              line
              for line in lines
              if re.search(r"FAILED|ERROR|Timeout|^E |assert|Error|Traceback", line)
              and "PASSED" not in line
          ]
          failures = [line for line in lines if line.startswith("FAILED ")]
          # GitHub keeps ten error, ten warning and ten notice annotations per
          # step and silently drops the rest, so the budget is spent in order of
          # usefulness: failing tests, then the thread dump of a hang, then the
          # log tail.
          # One annotation carries every failure, because GitHub keeps ten error
          # annotations per step and silently drops the rest: a run with thirteen
          # failures used to report only the first five names.
          if failures:
              joined = " || ".join(line[7:][:1500] for line in failures)
              print(f"::error::failing: {joined[:65000]}")
          for line in failures[:3]:
              print(f"::error::failed: {line[:400]}")
          for line in interesting[:3]:
              print(f"::error::first: {line[:900]}")
          frames = [
              line
              for line in lines
              if line.startswith(("Thread ", "Current thread", "=== ", "--- thread", "Fatal Python error"))
              or line.lstrip().startswith(("File \"", "Garbage-collecting"))
          ]
          fatal = any("Fatal Python error" in line for line in lines)
          print(f"::warning::dump: fatal={fatal}, {len(frames)} frame lines, {len(lines)} log lines")
          for line in frames[-9:]:
              print(f"::warning::frame: {line.strip()[:400]}")
          for line in lines[-3:]:
              print(f"::notice::tail: {line[:900]}")
          print(f"::notice::gui.log: {len(lines)} lines, {len(failures)} failing tests")
          PY
          if [ "${{ steps.gui.outcome }}" != "success" ]; then
            echo "GUI smoke tests failed or timed out"
            exit 1
          fi
      - name: Start-up numbers
        # The window's own budget, measured the same way before and after this
        # branch: three full builds, median reported, plus a profile of one build.
        # Annotations, because Actions log downloads are not always reachable.
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          set +e
          : > /tmp/startup.txt
          echo "=== this branch" | tee -a /tmp/startup.txt
          xvfb-run -a -s "-screen 0 1280x1024x24" python tools/bench_startup.py --profile --stages >>/tmp/startup.txt 2>&1
          echo "bench(this)=$?" | tee -a /tmp/startup.txt
          if [ -n "${{ github.base_ref }}" ]; then
            echo "=== base (${{ github.base_ref }})" | tee -a /tmp/startup.txt
            git fetch --depth 1 origin "${{ github.base_ref }}" >>/tmp/startup.txt 2>&1
            echo "fetch=$?" | tee -a /tmp/startup.txt
            base=$(git rev-parse FETCH_HEAD 2>/dev/null)
            rm -rf /tmp/phantom-base && mkdir -p /tmp/phantom-base
            if [ -n "$base" ]; then
              git archive "$base" | tar -x -C /tmp/phantom-base
              echo "archive=$? base=$base" | tee -a /tmp/startup.txt
              PYTHONPATH=/tmp/phantom-base/src xvfb-run -a -s "-screen 0 1280x1024x24" \
                python tools/bench_startup.py >>/tmp/startup.txt 2>&1
              echo "bench(base)=$?" | tee -a /tmp/startup.txt
            fi
          fi
          # One annotation per group: GitHub keeps ten per step and drops the
          # rest silently, so the whole measurement travels in three.
          echo "::notice::medians: $(grep -E '^STARTUP: median' /tmp/startup.txt | tr '\n' '|')"
          echo "::notice::stages: $(grep -E '^STARTUP: (stage|summary)' /tmp/startup.txt | head -14 | tr '\n' '|')"
          echo "::notice::profile: $(grep -E '^PROFILE:' /tmp/startup.txt | head -8 | tr '\n' '|')"
          if ! grep -q "^STARTUP: median" /tmp/startup.txt; then
            echo "::warning::bench: $(tail -4 /tmp/startup.txt | tr '\n' '|')"
          fi

      - name: Keep the GUI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-log-${{ matrix.python-version }}
          path: gui.log
          if-no-files-found: ignore
          retention-days: 7

  gui-macos:
    # The GUI suite on real Aqua.  Xvfb proves the Tk *widget* logic, not the
    # macOS window layer: the crash this job exists for (inside update_idletasks,
    # exit 139) happens on a runner the Linux jobs never touch.  Two interpreters:
    # the one setup-python ships (Tk 8.6 frameworks) and Homebrew's python-tk
    # (Tk 9.x, the layer the owner's MacBook runs) so a Tk 9 regression is caught
    # in CI instead of on the owner's desk.
    name: gui (macOS Aqua)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: |
          brew install libsndfile || brew upgrade libsndfile
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Which Tk is this?
        run: |
          python - <<'PY'
          import platform
          import tkinter

          root = tkinter.Tk()
          root.withdraw()
          root.update_idletasks()
          print(f"::notice::tk: {platform.machine()} {platform.mac_ver()[0]} "
                f"TkVersion={tkinter.TkVersion} patchlevel={root.tk.call('info', 'patchlevel')}")
          root.destroy()
          PY
      - name: GUI smoke tests (Aqua, bundled Tk)
        id: gui
        timeout-minutes: 20
        run: |
          set -o pipefail
          # No xvfb-run: Aqua needs the session, not a virtual display.  No
          # ``timeout`` either — macOS ships none (the Linux job's shell has it);
          # pytest-timeout kills a wedged test and the step cap covers the rest.
          python -m pytest -ra -m gui -v --durations=20 \
            --timeout=120 --timeout-method=thread \
            -o faulthandler_timeout=120 2>&1 | tee gui-macos.log
      - name: GUI log
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("gui-macos.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          failures = [line for line in lines if line.startswith(("FAILED ", "ERROR "))]
          fatal = [line for line in lines if "Fatal Python error" in line]
          # The frame list of a native crash is the only evidence there is: print
          # the whole block, not just its first line.
          if fatal:
              first = lines.index(fatal[0])
              block = "\n".join(lines[first : first + 60])
              print(f"::error::fatal-block: {block[:6000]}")
          frames = [
              line
              for line in lines
              if line.lstrip().startswith(("File \"", "Current thread", "Thread "))
          ]
          if fatal:
              print(f"::error::native crash: {' | '.join(line[:200] for line in fatal[:3])}")
          if failures:
              print(f"::error::failing: {' || '.join(line[7:][:1500] for line in failures)[:60000]}")
          for line in frames[-6:]:
              print(f"::warning::frame: {line.strip()[:400]}")
          # A callback that raised leaves no failing test, only a traceback on
          # stderr: without this the only evidence is a window that stopped moving.
          noise = [
              line
              for line in lines
              if "Exception in Tkinter callback" in line
              or "Traceback (most recent call last)" in line
              or "worker poll failed" in line
              or "worker event" in line
              or "operation " in line and "finished" in line
          ]
          for line in noise[:20]:
              print(f"::warning::callback: {line.strip()[:900]}")
          if noise:
              print(f"::notice::callback-noise: {len(noise)} lines")
          for line in lines[-3:]:
              print(f"::notice::tail: {line[:900]}")
          print(f"::notice::gui-macos.log: {len(lines)} lines, {len(failures)} failing tests")
          PY
          if [ "${{ steps.gui.outcome }}" != "success" ]; then
            echo "macOS GUI smoke tests failed, timed out or crashed"
            exit 1
          fi

  gui-tk9:
    # The layer the owner's MacBook runs: macOS ARM64 with Homebrew's Tcl/Tk 9.x.
    # The bundled Tk 8.6 job above stays exactly as it was — this one exists
    # because the last reproducible crash (a theme switch inside a Tk callback,
    # exit 139) only happens on 9.1.  Whether the runner reproduces it at all is
    # reported by the repro tool below, but the gate is the GUI suite.
    name: gui (macOS Aqua, Tk 9.1)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Homebrew Tcl/Tk 9 + the interpreter that links it
        run: |
          brew install python@3.12 python-tk@3.12 libsndfile || brew upgrade python-tk@3.12
          TK9=/opt/homebrew/bin/python3.12
          $TK9 -m venv .venv-tk9
          . .venv-tk9/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          import platform
          import tkinter
          import customtkinter

          root = tkinter.Tk()
          root.withdraw()
          print(
              f"::notice::tk9: {platform.machine()} {platform.mac_ver()[0]} "
              f"TkVersion={tkinter.TkVersion} TclVersion={tkinter.TclVersion} "
              f"patchlevel={root.tk.call('info', 'patchlevel')} "
              f"customtkinter={customtkinter.__version__}"
          )
          root.destroy()
          PY
      - name: Does this runner reproduce the theme-switch crash?
        id: repro
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Expected to die with exit 139 on a machine like the owner's; the point
          # of running it is the log, not the exit code.
          set -o pipefail
          . .venv-tk9/bin/activate
          python -X faulthandler -u tools/repro_tk91_theme_crash.py --toggles 3 \
            --delay 200 --update-between 2>&1 | tee repro-default.log
          echo "::notice::repro (default): exit $?"
      - name: The same case with the refusal armed (this must survive)
        timeout-minutes: 5
        run: |
          set -o pipefail
          . .venv-tk9/bin/activate
          python -X faulthandler -u tools/repro_tk91_theme_crash.py --quiet \
            --toggles 6 --delay 200 2>&1 | tee repro-quiet.log
      - name: Which widget kind crashes (Aqua, Tk 9.x)
        id: bisect
        continue-on-error: true
        timeout-minutes: 10
        run: |
          . .venv-tk9/bin/activate
          # Two passes: the crash may need the display-pass refusal armed, or not.
          python -u tools/bisect_tk91_theme.py --repeat 6 2>&1 | tee bisect-default.log
          echo "::notice::bisect (default): exit $?"
          python -u tools/bisect_tk91_theme.py --repeat 6 --quiet 2>&1 | tee bisect-quiet.log
          echo "::notice::bisect (quiet): exit $?"
          python - <<'PY'
          import pathlib

          for name in ("bisect-default.log", "bisect-quiet.log"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              lines = [line for line in path.read_text(errors="replace").splitlines() if line.strip()]
              last = lines[-1][:300] if lines else "(empty)"
              print(f"::notice::{name}: {len(lines)} lines, last: {last}")
              for line in lines[-6:]:
                  print(f"::notice::{name}| {line[:300]}")
          PY
      - name: Which test before the theme test matters (Aqua, Tk 9.x)
        id: gui-theme
        continue-on-error: true
        timeout-minutes: 15
        run: |
          . .venv-tk9/bin/activate
          # The theme tests pass on their own and die in the full suite, so the
          # trigger is in what runs before them.  Three prefixes, one annotation
          # each: whoever crashes names the test that leaves the bad state behind.
          run_prefix() {
            name="$1"; shift
            python -m pytest -m gui -q -k "$1" --timeout=120 --timeout-method=thread \
              -o faulthandler_timeout=120 > "prefix-$name.log" 2>&1
            code=$?
            echo "::notice::prefix $name ($1): exit $code"
            python - "$name" "$code" <<'PY'
          import pathlib
          import sys

          name, code = sys.argv[1], sys.argv[2]
          path = pathlib.Path(f"prefix-{name}.log")
          text = path.read_text(errors="replace") if path.exists() else ""
          print(f"::error::prefix {name} exit {code}: {text[-2500:]}")
          PY
          }
          run_prefix theme_only "test_theme_switch_persists or test_a_theme_switch_refuses_every_display_pass"
          run_prefix after_clipboard "test_clipboard_timer_clears_the_secret_natively or test_theme_switch_persists"
          run_prefix after_language "test_language_switch_updates_visible_text or test_theme_switch_persists"
          run_prefix all_three "test_clipboard_timer_clears_the_secret_natively or test_language_switch_updates_visible_text or test_theme_switch_persists or test_a_theme_switch_refuses_every_display_pass"
      - name: Native backtrace of the crash (lldb)
        id: lldb
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          . .venv-tk9/bin/activate
          # A segfault inside Tk leaves no Python frame in the faulthandler dump;
          # lldb stops at the fault and prints the native stack instead.
          xcrun lldb --batch \
            -o "settings set interpreter.echo-commands false" \
            -o run \
            -o "thread list" \
            -o "thread backtrace all" \
            -o quit \
            -- python -m pytest -m gui -q --timeout=120 --timeout-method=thread \
               -o faulthandler_timeout=120 > lldb.log 2>&1 || true
          python - <<'PY'
          import pathlib

          path = pathlib.Path("lldb.log")
          text = path.read_text(errors="replace").splitlines() if path.exists() else []
          interesting = [
              line
              for line in text
              if "stop reason" in line
              or line.strip().startswith("frame #")
              or "Fatal" in line
              or "error:" in line
          ]
          blob = "\n".join(interesting[:80]) if interesting else "\n".join(text[-40:])
          print(f"::error::lldb ({len(text)} lines, {len(interesting)} interesting): {blob[:6000]}")
          PY
      - name: GUI smoke tests (Aqua, Tk 9.x)
        id: gui
        timeout-minutes: 20
        run: |
          set -o pipefail
          . .venv-tk9/bin/activate
          python -m pytest -ra -m gui -v --durations=20 \
            --timeout=120 --timeout-method=thread \
            -o faulthandler_timeout=120 2>&1 | tee gui-tk9.log
      - name: macOS crash report of the last run
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import pathlib

          pattern = os.path.expanduser("~/Library/Logs/DiagnosticReports/*.ips")
          files = sorted(glob.glob(pattern), key=os.path.getmtime)[-2:]
          if not files:
              print("::notice::no crash report written")
          for path in files:
              raw = pathlib.Path(path).read_text(errors="replace").splitlines()
              head = json.loads(raw[0]) if raw else {}
              body: dict = {}
              try:
                  body = json.loads("\n".join(raw[1:]))
              except Exception:  # noqa: BLE001 - a truncated report is still worth noting
                  body = {}
              name = os.path.basename(path)
              exc = body.get("exception", {})
              print(f"::notice::ips {name}: {head.get('app_name')} {exc.get('type')} {exc.get('signal')}")
              images = [str(image.get("name", "?")) for image in body.get("usedImages", [])]
              threads = body.get("threads", [])
              index = body.get("faultingThread", 0)
              if isinstance(index, int) and index < len(threads):
                  frames = threads[index].get("frames", [])
                  rendered = [
                      f"{images[frame.get('imageIndex', 0)] if frame.get('imageIndex', 0) < len(images) else '?'}"
                      f"+{frame.get('imageOffset', '?')}"
                      for frame in frames[:25]
                  ]
                  print(f"::error::ips-frames: {' < '.join(rendered)[:6000]}")
          PY
      - name: GUI log
        if: always()
        run: |
          python - <<'PY'
          import pathlib

          path = pathlib.Path("gui-tk9.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          failures = [line for line in lines if line.startswith(("FAILED ", "ERROR "))]
          fatal = [line for line in lines if "Fatal Python error" in line]
          if fatal:
              print(f"::error::native crash: {' | '.join(line[:300] for line in fatal[:3])}")
          if failures:
              print(f"::error::failing: {' || '.join(line[7:][:1500] for line in failures)[:60000]}")
          noise = [
              line
              for line in lines
              if "Exception in Tkinter callback" in line
              or "worker poll failed" in line
          ]
          for line in noise[:10]:
              print(f"::warning::callback: {line.strip()[:900]}")
          for line in lines[-3:]:
              print(f"::notice::tk9 tail: {line[:900]}")
          if fatal:
              first = lines.index(fatal[0])
              block = "\n".join(lines[first : first + 60])
              print(f"::error::fatal-block: {block[:6000]}")
          print(f"::notice::gui-tk9.log: {len(lines)} lines, {len(failures)} failing tests")
          theme = pathlib.Path("gui-tk9-theme.log")
          if theme.exists():
              # One annotation, not sixty: the check-run API returns a page of them.
              blob = "\n".join(theme.read_text(errors="replace").splitlines()[-40:])
              print(f"::notice::theme log ({len(blob)} chars): {blob[:6000]}")
          PY
          if [ "${{ steps.gui.outcome }}" != "success" ]; then
            echo "macOS GUI tests under Tk 9 failed, timed out or crashed"
            exit 1
          fi

  benchmark:
    name: slow benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Slow tests
        run: python -m pytest -ra -m slow
